# WESLA configuration. Every key can be overridden by env vars, e.g.
#   WESLA_JUDGE__TAU2=0.75   WESLA_LLM__OLLAMA_MODEL=llama3.2:3b
domain = "tech-news"
data_dir = "data"

[llm]
providers = ["ollama", "groq"]          # tried in order; add "openrouter" or "echo"
ollama_url = "http://localhost:11434"
ollama_model = "llama3.2:1b"            # base learning model (columns are wesla-col_XXX)
groq_model = "llama-3.1-8b-instant"     # needs GROQ_API_KEY
temperature = 0.2
max_tokens = 512

[embedding]
backend = "sentence-transformers"       # or "hashing" (no download, lower quality)
model = "BAAI/bge-small-en-v1.5"        # MUST match the trainer's --embedder

[search]
providers = ["ddgs", "tavily"]          # tavily needs TAVILY_API_KEY
max_results = 6
fetch_pages = true
fetch_budget_s = 7.0                    # pages not fetched by then fall back to their search snippet
fetch_timeout_s = 6.0                   # per page

[chunk]
min_tokens = 256
max_tokens = 512
overlap_tokens = 32
max_chunks = 8                          # most query-relevant chunks verified + judged per web query
max_chunks_per_page = 3

[dedup]
threshold = 0.8
num_perm = 128

[verify]
consensus_sim = 0.70
min_sources = 2
contradiction_threshold = 0.80
contradiction_min_sim = 0.70             # NLI only vs memory about the same fact (CPU NLI ~0.4s/pair)
use_nli = true
nli_memory_k = 2                        # trusted memory items checked against each chunk
nli_model = "cross-encoder/nli-deberta-v3-small"
min_verified_score = 0.35

[memory]
db_path = "data/ltm.sqlite"
stm_turns = 8
decay_half_life_days = 30.0
hit_threshold = 0.74                    # bge-small: on-topic memory 0.75-0.88, off-topic ML questions up to 0.72
top_k = 5

[router]
memory_min_hits = 1
entropy_threshold = 0.45              # llama3.2:1b: wrong answers scored 0.56-0.92, correct ones 0.09-0.38
use_entropy = true

[judge]
w_r = 0.25
w_q = 0.25
w_n = 0.15
w_u = 0.20
w_s = 0.15
tau1 = 0.40
tau2 = 0.70
utility_saturation = 5
learn_min_stability = 0.5
learn_min_quality = 0.6
learn_min_recurrence = 1
merge_sim = 0.90

[queue]
path = "data/train_queue.jsonl"
hf_repo = ""                            # e.g. "your-user/wesla-train-queue" (needs HF_TOKEN)

[learn]
background = true                       # NLI on unused chunks + Learning Judge run after the answer
