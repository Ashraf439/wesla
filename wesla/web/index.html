<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/wesla.svg"><title>Wesla · Chat</title><link rel="stylesheet" href="/assets/chat.css"><script src="/assets/chat.js" defer></script></head>
<body><aside id="sidebar"><div class="brand"><img src="/assets/wesla.svg" alt=""> WESLA</div><button id="new">＋ &nbsp; New chat</button><h2>Recent chats</h2><nav id="recent"></nav><a class="tools" href="/tools/">⚙ &nbsp; Memory, learning &amp; logs ↗</a><a class="settings-link" href="#settings">Settings</a></aside><main><header><button id="toggle" aria-label="Toggle sidebar">☰</button><strong id="title">New chat</strong><span class="spacer"></span><button id="download" aria-label="Download chat" title="Download chat"></button></header><section id="scroll"><div id="welcome"><img class="hero-mark" src="/assets/wesla.svg" alt=""><h1>What’s on your mind?</h1><div class="suggest"><button>Explain a concept <span>↗</span></button><button>Compare two ideas <span>↗</span></button><button>Research a topic <span>↗</span></button></div></div><div id="thread"></div></section><footer><form id="composer"><div id="files"></div><input hidden multiple type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.pptx,.txt,.md,.csv,.tsv,.json,.log,.py,.js,.html,.xml,.yaml,.yml"><textarea id="question" rows="2" aria-label="Message Wesla" placeholder="Message Wesla…"></textarea><div class="bar"><button type="button" id="attach" title="Attach files" aria-label="Attach files">＋</button><span class="spacer"></span><div id="picker"><button type="button" id="model" aria-controls="models" aria-expanded="false"></button><div id="models" hidden role="group" aria-label="Available models"></div></div><button id="send" aria-label="Send message">↑</button></div></form><div id="status" role="status"></div></footer><section id="settings" hidden aria-labelledby="settings-heading">
